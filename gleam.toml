name = "aquamarine"
version = "0.1.0"
description = "Protocol-agnostic Beryl-style channel client runtime for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "aquamarine" }
gleam = ">= 1.7.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gluegun = { git = "https://github.com/tylerbutler/gluegun.git", ref = "532af1ac0308ff93c8a957467dbb638859593c93" }
roost = { git = "https://github.com/tylerbutler/roost.git", ref = "7dd796e83d8b0fcb8732cfac35707f3fbc8eeaed" }

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
beryl = { git = "https://github.com/tylerbutler/beryl.git", ref = "9e80433c6ff2b24c43815196c04ed4c9fd21cd21" }
mist = ">= 6.0.0 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }
